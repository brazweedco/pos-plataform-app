<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Payment</title>
  <script>
    // Dynamically load Square SDK based on environment
    const urlParams = new URLSearchParams(window.location.search);
    const appId = urlParams.get('appId') || '';
    const isSandbox = appId.startsWith('sandbox-');
    const sdkUrl = isSandbox
      ? 'https://sandbox.web.squarecdn.com/v1/square.js'
      : 'https://web.squarecdn.com/v1/square.js';

    const script = document.createElement('script');
    script.src = sdkUrl;
    script.onload = function() {
      document.dispatchEvent(new Event('square-sdk-loaded'));
    };
    document.head.appendChild(script);
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #FEF9F3;
      padding: 20px;
      min-height: 100vh;
    }

    .amount {
      font-size: 28px;
      font-weight: 700;
      color: #E46C45;
      text-align: center;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #0F2F38;
      margin-bottom: 8px;
    }

    #card-container {
      min-height: 90px;
    }

    .error-message {
      color: #DC2626;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    .button {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-top: 16px;
    }

    .button-primary {
      background-color: #E46C45;
      color: white;
    }

    .button-primary:disabled {
      background-color: #E4E4E7;
      color: #808080;
      cursor: not-allowed;
    }

    .button-secondary {
      background-color: transparent;
      color: #0F2F38;
      border: 1px solid #E4E4E7;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E4E4E7;
      border-top-color: #E46C45;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 16px;
      color: #808080;
      font-size: 14px;
    }

    .secure-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      color: #808080;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p class="loading-text">Loading secure payment form...</p>
  </div>

  <div id="payment-form" style="display: none;">
    <div id="amount-display" class="amount">$0.00</div>

    <div class="form-group">
      <label class="label">Card Details</label>
      <div id="card-container"></div>
      <p id="card-error" class="error-message"></p>
    </div>

    <button id="pay-button" class="button button-primary" disabled>
      Pay
    </button>

    <button id="cancel-button" class="button button-secondary">
      Cancel
    </button>

    <div class="secure-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Secured by Square
    </div>
  </div>

  <script>
    // Get parameters from URL (urlParams and appId already declared in head)
    const amount = parseFloat(urlParams.get('amount')) || 0;
    const locationId = urlParams.get('locationId') || '';

    let card;

    function postMessage(data) {
      window.parent.postMessage(data, '*');
    }

    async function initializePayments() {
      // Update amount display
      document.getElementById('amount-display').textContent = '$' + amount.toFixed(2);
      document.getElementById('pay-button').textContent = 'Pay $' + amount.toFixed(2);

      if (!appId || !locationId) {
        postMessage({
          type: 'TOKEN_ERROR',
          error: 'Missing Square credentials (appId or locationId)'
        });
        return;
      }

      try {
        const payments = Square.payments(appId, locationId);

        card = await payments.card({
          style: {
            '.input-container': {
              borderColor: '#E4E4E7',
              borderRadius: '12px',
            },
            '.input-container.is-focus': {
              borderColor: '#E46C45',
            },
            '.input-container.is-error': {
              borderColor: '#DC2626',
            },
            input: {
              backgroundColor: '#F7F5F3',
              color: '#0F2F38',
            },
            'input::placeholder': {
              color: '#808080',
            },
          }
        });

        await card.attach('#card-container');

        document.getElementById('loading').style.display = 'none';
        document.getElementById('payment-form').style.display = 'block';
        document.getElementById('pay-button').disabled = false;

        postMessage({ type: 'READY' });

      } catch (e) {
        console.error('Failed to initialize Square Payments:', e);
        postMessage({
          type: 'TOKEN_ERROR',
          error: 'Failed to load payment form: ' + e.message
        });
      }
    }

    async function handlePayment() {
      const payButton = document.getElementById('pay-button');
      const errorElement = document.getElementById('card-error');

      payButton.disabled = true;
      payButton.textContent = 'Processing...';
      errorElement.classList.remove('visible');

      try {
        const result = await card.tokenize();

        if (result.status === 'OK') {
          const cardDetails = result.details?.card;
          postMessage({
            type: 'TOKEN_SUCCESS',
            token: result.token,
            cardBrand: cardDetails?.brand,
            lastFour: cardDetails?.last4,
          });
        } else {
          let errorMsg = 'Card processing failed';
          if (result.errors && result.errors.length > 0) {
            errorMsg = result.errors.map(e => e.message).join(', ');
          }
          errorElement.textContent = errorMsg;
          errorElement.classList.add('visible');
          payButton.disabled = false;
          payButton.textContent = 'Pay $' + amount.toFixed(2);
        }
      } catch (e) {
        errorElement.textContent = e.message || 'Payment failed';
        errorElement.classList.add('visible');
        payButton.disabled = false;
        payButton.textContent = 'Pay $' + amount.toFixed(2);
      }
    }

    // Wait for Square SDK to load
    document.addEventListener('square-sdk-loaded', function() {
      initializePayments();

      document.getElementById('pay-button').addEventListener('click', handlePayment);

      document.getElementById('cancel-button').addEventListener('click', function() {
        postMessage({ type: 'CANCEL' });
      });
    });
  </script>
</body>
</html>
